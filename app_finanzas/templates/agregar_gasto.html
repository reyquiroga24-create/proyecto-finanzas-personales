<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agregar Gasto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="top-bar">
        <a href="{{ url_for('index', perfil=perfil) }}" class="btn btn-sm btn-outline">← Volver</a>
        <h1>💰 Nuevo Gasto</h1>
        <div></div>
    </div>
    <div class="container" style="padding-top:16px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">{% for c,m in messages %}<div class="alert alert-{{ c }}">{{ m }}</div>{% endfor %}</div>
            {% endif %}
        {% endwith %}
        <form method="POST" enctype="multipart/form-data" style="margin:0 16px;">
            <label for="monto">Monto ($)</label>
            <input type="number" id="monto" name="monto" step="0.01" placeholder="0.00" required>

            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" name="descripcion" placeholder="Ej: Supermercado" required>

            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
                <option value="">Seleccionar...</option>
                {% for cat in categorias %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" value="{{ hoy }}" required>

            <label for="recurrencia">Recurrencia</label>
            <select id="recurrencia" name="recurrencia">
                <option value="">No recurrente</option>
                <option value="Semanal">Semanal</option>
                <option value="Quincenal">Quincenal</option>
                <option value="Mensual">Mensual</option>
            </select>

            <label>📷 Comprobante (opcional)</label>
            <div style="margin-bottom:10px;">
                <input type="file" id="comprobante" name="comprobante" accept="image/*" capture="environment" style="width:100%;padding:8px;">
                <div class="file-preview" style="margin-top:6px;text-align:center;"></div>
            </div>

            <button type="submit">💾 Guardar Gasto</button>
        </form>
    </div>
    <script>
    // Cargar tema
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // Preview de foto
    document.getElementById('comprobante').addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.querySelector('.file-preview');
                preview.innerHTML = `<img src="${e.target.result}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--border);">`;
            };
            reader.readAsDataURL(this.files[0]);
        }
    });
    </script>
</body>
</html>
