<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Gasto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <a href="{{ url_for('index', perfil=perfil) }}" class="btn btn-secondary btn-sm">← Volver</a>
            <h1 style="font-size:1em;">Nuevo Gasto</h1>
            <div></div>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">{% for c,m in messages %}<div class="alert alert-{{ c }}">{{ m }}</div>{% endfor %}</div>
            {% endif %}
        {% endwith %}
        <form method="POST" enctype="multipart/form-data">
            <label for="monto">Monto ($)</label>
            <input type="number" id="monto" name="monto" step="0.01" placeholder="0.00" required>

            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" name="descripcion" placeholder="Ej: Supermercado" required>

            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
                <option value="">Seleccionar...</option>
                {% for cat in categorias %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" value="{{ hoy }}" required>

            <label for="recurrencia">Recurrencia</label>
            <select id="recurrencia" name="recurrencia">
                <option value="">No recurrente</option>
                <option value="Semanal">Semanal</option>
                <option value="Quincenal">Quincenal</option>
                <option value="Mensual">Mensual</option>
            </select>

            <label for="comprobante">Comprobante (opcional)</label>
            <input type="file" id="comprobante" name="comprobante" accept="image/*">

            <button type="submit">Guardar Gasto</button>
        </form>
    </div>
</body>
</html>
