<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Deuda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Editar Deuda</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label for="nombre">Nombre de la Deuda:</label>
            <input type="text" id="nombre" name="nombre" value="{{ deuda.nombre }}" required>

            <label for="monto_total">Monto Total:</label>
            <input type="number" id="monto_total" name="monto_total" step="0.01" value="{{ deuda.monto_total }}" required>

            <label for="monto_pagado">Monto Pagado:</label>
            <input type="number" id="monto_pagado" name="monto_pagado" step="0.01" value="{{ deuda.monto_pagado }}" required>

            <label for="fecha_inicio">Fecha de Inicio:</label>
            <input type="date" id="fecha_inicio" name="fecha_inicio" value="{{ deuda.fecha_inicio }}" required>

            <label for="fecha_fin_estimada">Fecha Fin Estimada:</label>
            <input type="date" id="fecha_fin_estimada" name="fecha_fin_estimada" value="{{ deuda.fecha_fin_estimada if deuda.fecha_fin_estimada else '' }}">

            <button type="submit" class="btn">Actualizar Deuda</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
