<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Ingreso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <a href="{{ url_for('index') }}" class="btn btn-secondary btn-sm">← Volver</a>
            <h1 style="font-size:1em;">Nuevo Ingreso</h1>
            <div></div>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label for="monto">Monto ($)</label>
            <input type="number" id="monto" name="monto" step="0.01" placeholder="0.00" required>

            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" name="descripcion" placeholder="Ej: Salario" required>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" value="{{ hoy }}" required>

            <label for="recurrencia">Recurrencia</label>
            <select id="recurrencia" name="recurrencia">
                <option value="">No recurrente</option>
                <option value="Semanal">Semanal</option>
                <option value="Quincenal">Quincenal</option>
                <option value="Mensual">Mensual</option>
            </select>

            <button type="submit">Guardar Ingreso</button>
        </form>
    </div>
</body>
</html>
