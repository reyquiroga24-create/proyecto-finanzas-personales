<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Gasto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <a href="{{ url_for('index', perfil=perfil) }}" class="btn btn-secondary btn-sm">← Volver</a>
            <h1 style="font-size:1em;">Editar Gasto</h1>
            <div></div>
        </div>
        <form method="POST">
            <label for="monto">Monto ($)</label>
            <input type="number" id="monto" name="monto" step="0.01" value="{{ gasto.monto }}" required>

            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" name="descripcion" value="{{ gasto.descripcion }}" required>

            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
                {% for cat in categorias %}
                <option value="{{ cat }}" {% if gasto.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" value="{{ gasto.fecha }}" required>

            <label for="recurrencia">Recurrencia</label>
            <select id="recurrencia" name="recurrencia">
                <option value="">No recurrente</option>
                <option value="Semanal" {% if gasto.recurrencia == 'Semanal' %}selected{% endif %}>Semanal</option>
                <option value="Quincenal" {% if gasto.recurrencia == 'Quincenal' %}selected{% endif %}>Quincenal</option>
                <option value="Mensual" {% if gasto.recurrencia == 'Mensual' %}selected{% endif %}>Mensual</option>
            </select>

            <button type="submit">Actualizar Gasto</button>
        </form>
    </div>
</body>
</html>
