<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Ingreso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Editar Ingreso</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label for="monto">Monto:</label>
            <input type="number" id="monto" name="monto" step="0.01" value="{{ ingreso.monto }}" required>

            <label for="descripcion">Descripción:</label>
            <input type="text" id="descripcion" name="descripcion" value="{{ ingreso.descripcion }}" required>

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" value="{{ ingreso.fecha }}" required>

            <label for="recurrencia">Recurrencia:</label>
            <select id="recurrencia" name="recurrencia">
                <option value="" {% if not ingreso.recurrencia %}selected{% endif %}>Ninguna</option>
                <option value="Semanal" {% if ingreso.recurrencia == 'Semanal' %}selected{% endif %}>Semanal</option>
                <option value="Quincenal" {% if ingreso.recurrencia == 'Quincenal' %}selected{% endif %}>Quincenal</option>
                <option value="Mensual" {% if ingreso.recurrencia == 'Mensual' %}selected{% endif %}>Mensual</option>
            </select>

            <button type="submit" class="btn">Actualizar Ingreso</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
